[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-reactor"
version = "0.1.0"
description = "Real-time gesture recognition with meme reactions."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mediapipe==1.0.1",
    "numpy==2.5.2",
    "opencv-python==5.0.0.93",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "flake8==7.3.0",
    "isort==8.0.1",
    "mypy==2.3.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["camera", "main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*"]
ignore_missing_imports = true
